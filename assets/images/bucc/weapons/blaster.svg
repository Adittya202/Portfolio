<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70">
  <defs>
    <linearGradient id="blasterMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#240046"/>
      <stop offset="100%" stop-color="#3c096c"/>
    </linearGradient>
    <linearGradient id="energyGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff70a6"/>
    </linearGradient>
  </defs>
  <!-- Main Frame -->
  <path d="M 20,20 L 80,16 L 95,22 L 95,34 L 75,36 L 40,36 L 30,58 L 16,56 L 24,30 Z" fill="url(#blasterMetal)" stroke="#ff007f" stroke-width="2"/>
  <!-- Dual Emitter Barrels -->
  <rect x="85" y="18" width="22" height="5" rx="1.5" fill="#10002b" stroke="#ff007f" stroke-width="1.5"/>
  <rect x="85" y="27" width="22" height="5" rx="1.5" fill="#10002b" stroke="#ff007f" stroke-width="1.5"/>
  <!-- Energy Core Coil -->
  <rect x="42" y="22" width="28" height="8" rx="2" fill="#10002b" stroke="#ff007f" stroke-width="1"/>
  <rect x="44" y="24" width="24" height="4" rx="1" fill="url(#energyGlow)"/>
  <!-- Cooling Vents -->
  <line x1="28" y1="23" x2="36" y2="23" stroke="#ff70a6" stroke-width="1.5"/>
  <line x1="28" y1="27" x2="36" y2="27" stroke="#ff70a6" stroke-width="1.5"/>
  <!-- Grip Texturing -->
  <line x1="20" y1="42" x2="32" y2="44" stroke="#7b2cbf" stroke-width="2"/>
  <line x1="18" y1="48" x2="29" y2="50" stroke="#7b2cbf" stroke-width="2"/>
</svg>
